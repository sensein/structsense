fail_fast: false

repos:
- repo: https://github.com/python-poetry/poetry
  rev: 2.1.3
  hooks:
  - id: poetry-check

- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.4.10
  hooks:
  - id: ruff
  - id: ruff-format

- repo: https://github.com/ComPWA/taplo-pre-commit
  rev: v0.9.3
  hooks:
  - id: taplo-format
    exclude: ^poetry.lock$

- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v4.6.0
  hooks:
  - id: check-added-large-files
    args: [--maxkb=15000]
  - id: check-case-conflict
  - id: end-of-file-fixer
    exclude: \.(pdf|svg|png|jpg|jpeg|zip|json)$|^evaluation/(?!.*\.(md|yaml|py)$).*$
  - id: trailing-whitespace
    exclude: \.(pdf|svg|png|jpg|jpeg|zip|json)$|^evaluation/(?!.*\.(md|yaml|py)$).*$
  # removing checks for json since they are mostly results (we can think about it later)
#  - id: pretty-format-json
#    args:
#    - --autofix
#    - --indent=4
#    - --no-sort-keys
  - id: check-merge-conflict
  - id: check-yaml
    # removing checks for json since they are mostly results (we can think about it later)
#  - id: check-json
  - id: check-toml
  - id: detect-private-key
  - id: name-tests-test

- repo: https://github.com/codespell-project/codespell
  rev: v2.3.0
  hooks:
  - id: codespell
    exclude: \.(pdf|svg|png|jpg|jpeg|zip|json)$|^evaluation/(?!.*\.(md|yaml)$).*$
    args:
    - --skip=poetry.lock,docs_style/pdoc-theme/syntax-highlighting.css,*.cha
    - --ignore-words-list=SIE,sie

- repo: https://github.com/hija/clean-dotenv
  rev: v0.0.7
  hooks:
  - id: clean-dotenv

- repo: local
  hooks:
  - id: yaml-file-extension
    name: Prefer .yaml over .yml.
    entry: YAML files must have .yaml extension.
    language: fail
    files: \.yml$
